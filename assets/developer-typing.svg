<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cute animated programmer typing at a computer</title>
  <desc id="desc">A cheerful chibi-style programmer sits at a desk and types on a glowing keyboard.</desc>
  <defs>
    <linearGradient id="screen" x1="238" y1="70" x2="498" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152D4A"/><stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="539" y1="169" x2="678" y2="274" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32D5FF"/><stop offset="1" stop-color="#7654FF"/>
    </linearGradient>
    <linearGradient id="rgb" x1="170" y1="0" x2="730" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/><stop offset=".5" stop-color="#8855FF"/><stop offset="1" stop-color="#FF4BA6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Soft, friendly floating sparkles -->
  <path d="M192 103l5 13 13 5-13 5-5 13-5-13-13-5 13-5 5-13zm511-31l4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10z" fill="#82F7FF" opacity=".8">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <circle cx="716" cy="132" r="4" fill="#FF70C8"><animate attributeName="cy" values="132;125;132" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="181" cy="185" r="3" fill="#A18BFF"><animate attributeName="cy" values="185;178;185" dur="1.7s" repeatCount="indefinite"/></circle>

  <!-- Desk -->
  <path d="M117 267h665" stroke="#61738F" stroke-width="8" stroke-linecap="round"/>
  <path d="M166 276v37m567-37v37" stroke="#43546F" stroke-width="7" stroke-linecap="round"/>
  <path d="M145 314h607" stroke="#25334A" stroke-width="8" stroke-linecap="round"/>

  <!-- Computer -->
  <rect x="211" y="57" width="318" height="190" rx="18" fill="#101827" stroke="#7183A2" stroke-width="4"/>
  <rect x="222" y="68" width="296" height="165" rx="11" fill="url(#screen)"/>
  <rect x="222" y="68" width="296" height="165" rx="11" fill="#28DFFF" opacity=".025">
    <animate attributeName="opacity" values=".015;.08;.015" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <path d="M228 75h284" stroke="#54E9FF" stroke-width="2" opacity=".55" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 148;0 0" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M337 249v15m68-15v15m-92 2h116" stroke="#72829D" stroke-width="7" stroke-linecap="round"/>
  <circle cx="240" cy="85" r="4" fill="#FF7185"/><circle cx="254" cy="85" r="4" fill="#FFD166"/><circle cx="268" cy="85" r="4" fill="#55E89B"/>
  <g font-family="monospace" font-size="13" font-weight="700">
    <text x="251" y="119" fill="#B48CFF">&lt;?php</text>
    <text x="251" y="145" fill="#83E7FF">echo</text><text x="292" y="145" fill="#FFE08A"> "Hello!";</text>
    <text x="251" y="171" fill="#83E7FF">build</text><text x="294" y="171" fill="#B7F7C2">("cool things");</text>
    <rect x="251" y="187" width="8" height="17" rx="2" fill="#72F6FF"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
  </g>
  <path d="M318 215h105" stroke="#21D9E8" stroke-width="2" stroke-dasharray="5 8" opacity=".55"/>

  <!-- Comfy chair -->
  <path d="M645 199c0-20 15-34 34-34h49c18 0 31 14 31 32v58H645z" fill="#202B40" stroke="#61718B" stroke-width="3"/>
  <path d="M679 256v37m49-37v37m-69 0h89" stroke="#61718B" stroke-width="6" stroke-linecap="round"/>
  <circle cx="678" cy="298" r="6" fill="#384A67"/><circle cx="746" cy="298" r="6" fill="#384A67"/>

  <!-- Small chibi programmer -->
  <!-- legs and sneakers -->
  <path d="M569 246c-4 22 5 36 26 42l43 12" stroke="#313D5A" stroke-width="20" stroke-linecap="round"/>
  <path d="M626 296c15 2 28 9 29 17 0 5-6 8-15 7l-47-9c-7-2-10-8-5-13 8-7 21-6 38-2z" fill="#E7F4FF" stroke="#9DB5D3" stroke-width="2"/>
  <path d="M657 313h-25" stroke="#FF65B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M614 241c-7 20-4 35 13 46l41 19" stroke="#313D5A" stroke-width="20" stroke-linecap="round"/>
  <path d="M666 302c14 5 23 14 21 21-1 5-7 7-16 4l-44-18c-7-3-8-9-2-13 9-5 21 0 41 6z" fill="#E7F4FF" stroke="#9DB5D3" stroke-width="2"/>
  <path d="M687 322h-24" stroke="#48DDF5" stroke-width="4" stroke-linecap="round"/>

  <!-- Hoodie body -->
  <path d="M556 168c15-14 34-20 56-17 25 3 43 20 49 45l14 54H530l8-52c2-13 8-23 18-30z" fill="url(#hoodie)" stroke="#9B9AFF" stroke-width="3">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <path d="M575 165c4 19 17 29 33 29s29-10 34-29" stroke="#C7C6FF" stroke-width="4"/>
  <path d="M606 197v45m-8-28 8 8 8-8" stroke="#D5E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>

  <!-- Big friendly face -->
  <path d="M548 119c0-34 21-56 53-56s54 23 54 56v17c0 33-23 54-54 54s-53-21-53-54z" fill="#F3BD91" stroke="#FFD8B7" stroke-width="2"/>
  <path d="M543 119c-4-36 14-66 51-71 33-5 62 17 64 51 1 13-2 24-8 34-7-18-18-29-35-34-21 14-43 18-68 13l-4 17z" fill="#29304B"/>
  <path d="M558 127c4-4 10-4 14 0m48 0c4-4 10-4 14 0" stroke="#38405E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="568" cy="139" r="3.5" fill="#26334D"/><circle cx="626" cy="139" r="3.5" fill="#26334D"/>
  <path d="M581 155c8 9 22 9 30 0" stroke="#D96F78" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="550" cy="151" rx="7" ry="4" fill="#FF8D9F" opacity=".7"/><ellipse cx="644" cy="151" rx="7" ry="4" fill="#FF8D9F" opacity=".7"/>
  <path d="M547 108c-10-4-16 2-14 12 1 8 7 12 15 11m108-23c10-4 16 2 14 12-1 8-7 12-15 11" stroke="#55E8FF" stroke-width="4"/>

  <!-- Little hands bounce while typing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0;0 -2;0 0" dur=".48s" repeatCount="indefinite"/>
    <path d="M550 201c-21 9-39 25-55 41l-44 8" stroke="#45C9F7" stroke-width="15" stroke-linecap="round"/>
    <path d="M454 250l-16 8c-7 3-14-1-13-7 1-4 4-7 8-8l17-5" fill="#F3BD91"/>
    <path d="M632 203c-26 6-49 17-69 33l-47 15" stroke="#5E83FF" stroke-width="15" stroke-linecap="round"/>
    <path d="M524 251l-17 8c-7 3-14-1-13-7 1-4 4-7 8-8l18-5" fill="#F3BD91"/>
  </g>

  <!-- Keyboard and tiny typing sparkles -->
  <path d="M394 260h177l-11 17H405z" fill="#202C42" stroke="#7183A2" stroke-width="2"/>
  <path d="M412 265h5m8 0h5m8 0h5m8 0h5m8 0h5m8 0h5m8 0h5m8 0h5m8 0h5m8 0h5m8 0h5m8 0h5" stroke="#62E9FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur=".55s" repeatCount="indefinite"/>
  </path>
  <path d="M446 241l-5-8m66 8 5-8m-35 3v-9" stroke="#FFE48A" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values=".3;1;.3" dur=".8s" repeatCount="indefinite"/>
  </path>

  <!-- Small RGB floor glow -->
  <ellipse cx="477" cy="316" rx="246" ry="8" fill="url(#rgb)" opacity=".28"/>
  <text x="548" y="89" fill="#76EFFF" font-family="monospace" font-size="15" font-weight="700" filter="url(#glow)">{ }</text>
  <text x="700" y="139" fill="#FF71C8" font-family="monospace" font-size="14" font-weight="700" filter="url(#glow)">&lt;/&gt;</text>
  <path d="M559 96l4-8 4 8m111 43 4-8 4 8" stroke="#FFE48A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/>
  </path>
</svg>
