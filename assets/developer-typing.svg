<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Developer typing at a computer</title>
  <desc id="desc">A neon-lit developer works at a computer while code scrolls on the screen.</desc>
  <defs>
    <linearGradient id="panel" x1="80" y1="24" x2="870" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#090D15"/>
    </linearGradient>
    <linearGradient id="screen" x1="190" y1="85" x2="440" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10243A"/>
      <stop offset="1" stop-color="#090E1B"/>
    </linearGradient>
    <linearGradient id="shirt" x1="543" y1="181" x2="691" y2="305" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315CFF"/>
      <stop offset="1" stop-color="#8B36E9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="22" y="16" width="916" height="328" rx="20" fill="url(#panel)" stroke="#263346"/>
  <ellipse cx="492" cy="318" rx="322" ry="15" fill="#2269FF" opacity=".18" filter="url(#soft)"/>
  <text x="58" y="54" fill="#8FA4BE" font-family="monospace" font-size="12" letter-spacing="2">BUILD · DEPLOY · REPEAT</text>
  <circle cx="880" cy="46" r="4" fill="#3DFFB2"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="858" y="50" fill="#91A4BD" font-family="monospace" font-size="10" text-anchor="end">ONLINE</text>

  <!-- Monitor -->
  <rect x="111" y="75" width="379" height="218" rx="13" fill="#080B12" stroke="#40516B" stroke-width="2"/>
  <rect x="121" y="85" width="359" height="198" rx="8" fill="url(#screen)"/>
  <rect x="121" y="85" width="359" height="25" rx="8" fill="#172235"/>
  <circle cx="139" cy="97" r="3.5" fill="#FF5F57"/><circle cx="152" cy="97" r="3.5" fill="#FFBD2E"/><circle cx="165" cy="97" r="3.5" fill="#28C840"/>
  <text x="300" y="101" fill="#7889A2" font-family="monospace" font-size="10" text-anchor="middle">app.php — insanity.dev</text>
  <g font-family="monospace" font-size="12">
    <text x="145" y="137" fill="#7C8CA7">01</text><text x="174" y="137" fill="#C792EA">&lt;?php</text>
    <text x="145" y="162" fill="#7C8CA7">02</text><text x="174" y="162" fill="#82AAFF">Route</text><text x="211" y="162" fill="#F2CD7A">::get</text><text x="249" y="162" fill="#D8DEE9">('/hello',</text>
    <text x="145" y="187" fill="#7C8CA7">03</text><text x="174" y="187" fill="#A6E3A1">fn</text><text x="192" y="187" fill="#D8DEE9">() =&gt; </text><text x="236" y="187" fill="#89DDFF">view</text><text x="268" y="187" fill="#D8DEE9">('welcome');</text>
    <text x="145" y="212" fill="#7C8CA7">04</text><text x="174" y="212" fill="#6B7890">// ship something useful</text>
    <text x="145" y="237" fill="#7C8CA7">05</text><text x="174" y="237" fill="#82AAFF">return</text><text x="221" y="237" fill="#D8DEE9">response()-&gt;json($data);</text>
    <rect x="174" y="252" width="7" height="15" rx="1" fill="#21E6D3"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <path d="M268 294v13m48-13v13m-74 0h100" stroke="#66758D" stroke-width="5" stroke-linecap="round"/>
  <path d="M242 308h101" stroke="#24344B" stroke-width="7" stroke-linecap="round"/>

  <!-- Desk and keyboard -->
  <path d="M83 304h795" stroke="#71809A" stroke-width="7" stroke-linecap="round"/>
  <path d="M140 311v26m679-26v26" stroke="#46556C" stroke-width="6" stroke-linecap="round"/>
  <path d="M389 287h132l-12 14H400z" fill="#26364E" stroke="#546783"/>
  <path d="M403 292h105" stroke="#21D7E8" stroke-width="2" stroke-dasharray="4 6" opacity=".9"/>

  <!-- Chair -->
  <path d="M727 181c0-17 12-29 29-29h53c18 0 30 13 30 30v83H727z" fill="#192235" stroke="#53617A" stroke-width="3"/>
  <path d="M756 266v35m51-35v35m-70 0h86" stroke="#53617A" stroke-width="5" stroke-linecap="round"/>
  <circle cx="739" cy="309" r="6" fill="#33445E"/><circle cx="842" cy="309" r="6" fill="#33445E"/>

  <!-- Seated developer -->
  <path d="M587 188c15-15 34-20 55-15 26 6 39 29 43 61l9 67H539l9-71c4-22 17-34 39-42z" fill="url(#shirt)" stroke="#8A9BFF" stroke-width="2"/>
  <path d="M602 186l18 22 21-22" stroke="#B3C1FF" stroke-width="3" opacity=".8"/>
  <path d="M579 288h89l-11 16h-88z" fill="#182033"/>
  <path d="M574 300l-29 33m99-31 31 31" stroke="#8C9AB0" stroke-width="13" stroke-linecap="round"/>
  <path d="M529 336h-24m177 0h24" stroke="#66758D" stroke-width="6" stroke-linecap="round"/>

  <!-- Head, hair, and headset -->
  <path d="M596 145c0-29 17-48 43-48 27 0 45 20 45 48v15c0 25-19 43-44 43-26 0-44-18-44-43z" fill="#C98B70"/>
  <path d="M593 147c-7-31 7-61 40-68 28-6 54 10 59 36 3 15-1 25-7 34-4-16-13-27-28-33-18 10-39 13-61 11l-3 22z" fill="#202237"/>
  <path d="M590 139c-13-5-20 3-17 17 2 10 9 15 19 13m93-30c13-5 20 3 17 17-2 10-9 15-19 13" stroke="#21E6D3" stroke-width="4"/>
  <path d="M586 161c-9-13-8-28-2-39m112 39c9-13 8-28 2-39" stroke="#21E6D3" stroke-width="2" opacity=".8"/>

  <!-- Moving arms and hands -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0;0 -1;0 0" dur=".42s" repeatCount="indefinite"/>
    <path d="M573 210c-26 5-49 18-66 36l-47 26" stroke="#596DFF" stroke-width="23" stroke-linecap="round"/>
    <path d="M460 270l-27 13c-8 4-17-1-17-9 0-5 4-9 9-11l29-12" fill="#C98B70"/>
    <path d="M638 211c-30 3-60 13-83 29l-65 37" stroke="#7653EA" stroke-width="22" stroke-linecap="round"/>
    <path d="M496 278l-26 12c-8 4-17 0-18-8-1-5 3-10 8-12l30-13" fill="#C98B70"/>
  </g>
  <path d="M445 284l6-9m8 14 7-10m-2 15 8-10" stroke="#FFD29E" stroke-width="2" stroke-linecap="round" opacity=".9"/>

</svg>
