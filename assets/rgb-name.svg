<svg xmlns="http://www.w3.org/2000/svg" width="900" height="82" viewBox="0 0 900 82" fill="none" role="img" aria-labelledby="title">
  <title id="title">Insanity Dzikriyana animated RGB title</title>
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/><stop offset=".2" stop-color="#397BFF"/><stop offset=".42" stop-color="#A64DFF"/><stop offset=".64" stop-color="#FF42B3"/><stop offset=".82" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FFE45E"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-900 0;900 0;-900 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#neon)">
    <text x="450" y="55" text-anchor="middle" fill="url(#spectrum)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing=".2">Insanity Dzikriyana">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3.2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
