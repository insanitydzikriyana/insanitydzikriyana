<svg xmlns="http://www.w3.org/2000/svg" width="760" height="46" viewBox="0 0 760 46" fill="none" role="img" aria-labelledby="title">
  <title id="title">Insanity Dzikriyana animated together on one line</title>
  <defs>
    <clipPath id="leftReveal">
      <rect x="80" y="0" width="0" height="46">
        <animate attributeName="width" values="0;220;220" keyTimes="0;.45;1" dur="1.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="rightReveal">
      <rect x="680" y="0" width="0" height="46">
        <animate attributeName="x" values="680;460;460" keyTimes="0;.45;1" dur="1.4s" fill="freeze"/>
        <animate attributeName="width" values="0;220;220" keyTimes="0;.45;1" dur="1.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <text x="90" y="32" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="650" fill="#DCE6F2" clip-path="url(#leftReveal)">Insanity</text>
  <text x="460" y="32" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="650" fill="#DCE6F2" clip-path="url(#rightReveal)">Dzikriyana</text>
</svg>
