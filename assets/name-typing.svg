<svg xmlns="http://www.w3.org/2000/svg" width="760" height="46" viewBox="0 0 760 46" fill="none" role="img" aria-labelledby="title">
  <title id="title">Insanity Dzikriyana animated together on one line</title>
  <defs>
    <clipPath id="leftReveal">
      <rect x="250" y="0" width="0" height="46">
        <animate attributeName="width" values="0;110;110;0;0" keyTimes="0;.08;.70;.76;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="rightReveal">
      <rect x="495" y="0" width="0" height="46">
        <animate attributeName="x" values="495;360;360;495;495" keyTimes="0;.08;.70;.76;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="width" values="0;135;135;0;0" keyTimes="0;.08;.70;.76;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <text x="260" y="32" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="650" fill="#DCE6F2" clip-path="url(#leftReveal)">Insanity</text>
  <text x="360" y="32" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="650" fill="#DCE6F2" clip-path="url(#rightReveal)">Dzikriyana</text>
</svg>
