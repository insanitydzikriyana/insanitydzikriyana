<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="32" viewBox="0 0 1200 32" fill="none" role="img" aria-labelledby="title">
  <title id="title">Animated RGB zigzag line</title>
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset=".32" stop-color="#4169FF"/>
      <stop offset=".66" stop-color="#C026FF"/>
      <stop offset="1" stop-color="#FF2D8D"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1000 0;1000 0;-1000 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M8 16H112L128 5L144 27L160 16H272L288 5L304 27L320 16H432L448 5L464 27L480 16H592L608 5L624 27L640 16H752L768 5L784 27L800 16H912L928 5L944 27L960 16H1072L1088 5L1104 27L1120 16H1192" stroke="url(#rgb)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="48 18" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-66" dur="1.1s" repeatCount="indefinite"/>
  </path>
</svg>
