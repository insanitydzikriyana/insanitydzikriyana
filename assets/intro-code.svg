<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Animated code introduction</title>
  <desc id="desc">Code lines introduce Insanity Dzikriyana, a software engineer and hosting and server specialist from Bandung and graduate of SMKN 1 Karawang.</desc>
  <defs>
    <linearGradient id="border" x1="70" y1="0" x2="930" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/><stop offset=".5" stop-color="#7357FF"/><stop offset="1" stop-color="#FF3A9D"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-500 0;500 0;-500 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="keyword" x1="82" y1="0" x2="330" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5BE7FF"/><stop offset="1" stop-color="#B88CFF"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal1"><rect x="98" y="80" width="0" height="22"><animate attributeName="width" values="0;210;210;0" keyTimes="0;.14;.88;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="reveal2"><rect x="98" y="108" width="0" height="22"><animate attributeName="width" values="0;290;290;0" keyTimes="0;.14;.88;1" dur="8s" begin=".45s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="reveal3"><rect x="98" y="136" width="0" height="22"><animate attributeName="width" values="0;550;550;0" keyTimes="0;.14;.88;1" dur="8s" begin=".9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="reveal4"><rect x="98" y="164" width="0" height="22"><animate attributeName="width" values="0;280;280;0" keyTimes="0;.14;.88;1" dur="8s" begin="1.35s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="reveal5"><rect x="98" y="192" width="0" height="22"><animate attributeName="width" values="0;310;310;0" keyTimes="0;.14;.88;1" dur="8s" begin="1.8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="reveal6"><rect x="98" y="220" width="0" height="22"><animate attributeName="width" values="0;470;470;0" keyTimes="0;.14;.88;1" dur="8s" begin="2.25s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect x="15" y="13" width="970" height="244" rx="18" fill="#0B111B" stroke="url(#border)" stroke-width="2" filter="url(#glow)"/>
  <path d="M16 53h968" stroke="#253347" stroke-width="1"/>
  <circle cx="40" cy="34" r="5" fill="#FF5F57"/><circle cx="58" cy="34" r="5" fill="#FFBD2E"/><circle cx="76" cy="34" r="5" fill="#28C840"/>
  <text x="500" y="39" text-anchor="middle" fill="#8191A9" font-family="monospace" font-size="13">insanity.profile.ts</text>
  <text x="956" y="39" text-anchor="end" fill="#5BE7FF" font-family="monospace" font-size="11">LIVE</text>

  <g font-family="monospace" font-size="16" font-weight="600">
    <g fill="#526179" text-anchor="end">
      <text x="78" y="98">01</text><text x="78" y="126">02</text><text x="78" y="154">03</text>
      <text x="78" y="182">04</text><text x="78" y="210">05</text><text x="78" y="238">06</text>
    </g>
    <g fill="#D6E2F3">
      <text x="98" y="98">const profile = {</text>
      <text x="98" y="126">  name: "Insanity Dzikriyana",</text>
      <text x="98" y="154">  role: ["Software Engineer", "Hosting &amp; Server"],</text>
      <text x="98" y="182">  origin: "Bandung, Indonesia",</text>
      <text x="98" y="210">  education: "Graduate of SMKN 1 Karawang",</text>
      <text x="98" y="238">  mission: "Innovate for Indonesia." };</text>
    </g>
    <g fill="url(#keyword)">
      <text x="98" y="98" clip-path="url(#reveal1)">const profile = {</text>
      <text x="98" y="126" clip-path="url(#reveal2)">  name: "Insanity Dzikriyana",</text>
      <text x="98" y="154" clip-path="url(#reveal3)">  role: ["Software Engineer", "Hosting &amp; Server"],</text>
      <text x="98" y="182" clip-path="url(#reveal4)">  origin: "Bandung, Indonesia",</text>
      <text x="98" y="210" clip-path="url(#reveal5)">  education: "Graduate of SMKN 1 Karawang",</text>
      <text x="98" y="238" clip-path="url(#reveal6)">  mission: "Innovate for Indonesia." };</text>
    </g>
    <rect x="556" y="222" width="2" height="19" rx="1" fill="#62F4FF" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
